name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile get_embedding_function.py populate_database.py query_data.py test_rag.py

      - name: Check Environment Template Integrity
        run: |
          test -f .env.example || exit 1
          grep -q "EMBEDDING_PROVIDER" .env.example || exit 1
          grep -q "CHROMA_PATH" .env.example || exit 1

  frontend-check:
    name: Frontend Assets & Structure Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Web Dashboard Files
        run: |
          test -f frontend/index.html || exit 1
          test -f frontend/styles.css || exit 1
          test -f frontend/app.js || exit 1
          test -f frontend/README.md || exit 1

      - name: Verify Documentation Images & Assets
        run: |
          test -f assets/hero_banner.jpg || exit 1
          test -f assets/dashboard_preview.jpg || exit 1
          test -f assets/architecture_workflow.jpg || exit 1
          test -f assets/citation_tracking.jpg || exit 1
